<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>오늘 뭐 입지 | 주간 코디 플래너</title>
  <style>
    @import url("https://fonts.googleapis.com/css2?family=Jua&display=swap");
    :root { --ink: #59484c; --muted: #a38e94; --paper: #fff4f6; --panel: #fffdfd; --line: #f2dce2; --olive: #d98fa5; --olive-dark: #b86d87; --sage: #fbe3ea; --coral: #e993a8; --yellow: #f8d99a; --shadow: 0 16px 42px rgba(190, 113, 139, .13); }
    * { box-sizing: border-box; }
    body { margin: 0; min-height: 100vh; color: var(--ink); font-family: "Jua", "Malgun Gothic", sans-serif; background: radial-gradient(circle at 8% 4%, #ffe2eb 0 9%, transparent 25%), radial-gradient(circle at 92% 30%, #fff0d9 0 7%, transparent 23%), var(--paper); }
    button, input, select { font: inherit; } button { border: 0; cursor: pointer; }
    .shell { width: min(1180px, calc(100% - 48px)); margin: 0 auto; padding: 54px 0 70px; }
    .topbar { display: flex; justify-content: space-between; align-items: end; gap: 24px; margin-bottom: 42px; }
    .top-tools { display: grid; justify-items: end; gap: 12px; }
    .image-save-btn { padding: 10px 15px; color: #fff; background: var(--coral); border-radius: 12px; box-shadow: 0 6px 14px rgba(190, 113, 139, .18); font-size: 12px; font-weight: 400; }
    .image-save-btn:hover { background: var(--olive-dark); }
    .brand-mark { display: inline-flex; align-items: center; gap: 9px; color: var(--olive-dark); font-size: 12px; font-weight: 800; letter-spacing: 1.8px; }
    .brand-mark::before { content: ""; width: 10px; height: 10px; border-radius: 50%; background: var(--coral); box-shadow: 5px -4px 0 var(--yellow); }
    h1, h2, p { margin-top: 0; } h1 { max-width: 550px; margin: 14px 0 0; color: #674b55; font-family: "Jua", "Malgun Gothic", sans-serif; font-size: clamp(42px, 6vw, 72px); font-weight: 400; line-height: .98; letter-spacing: -1px; }
    .date-note { margin: 0 0 5px; color: var(--muted); font-size: 13px; } .save-note { display: flex; align-items: center; gap: 8px; color: var(--muted); font-size: 12px; } .save-note::before { content: ""; width: 7px; height: 7px; border-radius: 50%; background: var(--olive); }
    .layout { display: grid; grid-template-columns: 1fr; gap: 26px; align-items: start; }
    .panel { padding: 28px; background: rgba(255, 253, 253, .94); border: 1px solid rgba(242, 220, 226, .9); border-radius: 18px; box-shadow: var(--shadow); }
    .panel-heading { display: flex; justify-content: space-between; align-items: start; gap: 15px; margin-bottom: 24px; } .kicker { margin: 0 0 7px; color: var(--coral); font-size: 11px; font-weight: 800; letter-spacing: 1.4px; } h2 { margin: 0; font-family: "Jua", "Malgun Gothic", sans-serif; font-size: 28px; font-weight: 400; } .week-label { color: var(--muted); font-size: 12px; text-align: right; }
    .week-grid { display: grid; grid-template-columns: repeat(7, minmax(82px, 1fr)); gap: 8px; }
    .day-card { min-width: 0; min-height: 235px; padding: 13px 10px; background: #fffafb; border: 1px solid var(--line); border-radius: 14px; transition: border-color .18s, transform .18s, box-shadow .18s; } .day-card.today { border: 2px solid var(--olive); background: #fff0f4; } .day-card:hover { transform: translateY(-2px); box-shadow: 0 8px 18px rgba(190, 113, 139, .12); } .day-card.drag-over { border-color: var(--coral); background: #fff0f2; transform: translateY(-2px); }
    .day-top { display: flex; justify-content: space-between; align-items: baseline; margin-bottom: 15px; } .day-name { font-size: 13px; font-weight: 800; } .day-number { color: var(--muted); font-size: 11px; } .today .day-name { color: var(--olive-dark); }
    .outfit-slot { display: flex; min-height: 38px; align-items: center; justify-content: space-between; gap: 5px; margin-top: 7px; padding: 6px; color: var(--muted); background: #fff; border: 1px dashed #d8e4dc; border-radius: 9px; font-size: 11px; text-align: center; line-height: 1.3; } .outfit-slot.filled { color: var(--ink); border-style: solid; border-color: transparent; background: var(--sage); font-weight: 700; cursor: grab; } .outfit-slot.filled:active { cursor: grabbing; } .outfit-slot .slot-label { display: block; margin-bottom: 2px; color: var(--olive-dark); font-size: 9px; } .outfit-delete { flex: 0 0 auto; padding: 2px 4px; color: #9eb2a7; background: transparent; font-size: 13px; line-height: 1; } .outfit-delete:hover { color: var(--coral); } .day-memo { width: 100%; min-height: 42px; margin: 8px 0 10px; padding: 7px; resize: vertical; color: var(--ink); background: #fffdf8; border: 1px solid var(--line); border-radius: 8px; outline: none; font-size: 10px; line-height: 1.4; } .day-memo:focus { border-color: var(--olive); box-shadow: 0 0 0 2px var(--sage); } .day-add-form { display: grid; gap: 5px; margin-top: 0; } .day-add-form input { width: 100%; min-width: 0; padding: 7px 6px; color: var(--ink); background: #fff; border: 1px solid var(--line); border-radius: 8px; outline: none; font-size: 10px; } .day-add-form button { padding: 7px 5px; color: #fff; background: var(--olive); border-radius: 8px; font-size: 10px; font-weight: 800; } .day-add-form button:hover { background: var(--olive-dark); }
    .wardrobe { position: static; order: -1; } .wardrobe-form { display: grid; grid-template-columns: 1fr auto; gap: 9px; margin-bottom: 22px; } .wardrobe-form input, .planner-form input, .planner-form select { width: 100%; min-width: 0; padding: 12px 13px; color: var(--ink); background: #faf9f5; border: 1px solid var(--line); border-radius: 5px; outline: none; font-size: 13px; } .wardrobe-form input:focus, .planner-form input:focus, .planner-form select:focus { border-color: var(--olive); box-shadow: 0 0 0 3px var(--sage); }
    .add-btn { padding: 0 16px; color: #fff; background: var(--olive); border-radius: 10px; font-weight: 800; } .add-btn:hover { background: var(--olive-dark); }
    .clothes-list { display: grid; grid-template-columns: repeat(auto-fill, minmax(150px, 1fr)); gap: 6px; max-height: 190px; overflow-y: auto; } .clothing-item { display: flex; min-width: 0; align-items: center; gap: 6px; padding: 7px; background: #fffafb; border: 1px solid var(--line); border-radius: 10px; cursor: grab; } .clothing-item:active { cursor: grabbing; } .clothing-icon { display: grid; width: 24px; height: 24px; flex: 0 0 24px; place-items: center; color: var(--olive-dark); background: var(--sage); border-radius: 50%; font-size: 12px; } .clothing-info { min-width: 0; flex: 1; } .clothing-name { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; font-size: 11px; font-weight: 700; } .delete-btn { padding: 2px; color: #d0aab7; background: transparent; font-size: 14px; line-height: 1; } .delete-btn:hover { color: var(--coral); } .empty-wardrobe { grid-column: 1 / -1; padding: 18px 4px; color: var(--muted); font-size: 12px; line-height: 1.6; text-align: center; }
    .planner { margin-top: 26px; } .planner-heading { align-items: center; } .planner-help { max-width: 190px; color: var(--muted); font-size: 12px; line-height: 1.45; text-align: right; } .planner-form { display: grid; grid-template-columns: 1fr 1fr 1.3fr auto; gap: 10px; } .planner-form select { min-width: 0; } .save-btn { padding: 0 21px; color: #fff; background: var(--coral); border-radius: 5px; font-weight: 800; } .save-btn:hover { background: #bb5d47; }
    @media (max-width: 900px) { .week-grid { overflow-x: auto; grid-template-columns: repeat(7, minmax(108px, 1fr)); padding-bottom: 5px; } }
    @media (max-width: 560px) { .shell { width: min(100% - 28px, 500px); padding-top: 32px; } .topbar { display: block; margin-bottom: 28px; } .date-note { margin-top: 24px; } .panel { padding: 19px; } .panel-heading { margin-bottom: 18px; } .planner-form { grid-template-columns: 1fr 1fr; } .planner-form .save-btn { min-height: 44px; grid-column: 1 / -1; } }
  </style>
</head>
<body>
  <main class="shell">
    <header class="topbar"><div><span class="brand-mark">WEAR THIS WEEK</span><h1>여행지에서<br>뭐 입지?</h1></div><div class="top-tools"><button class="image-save-btn" id="image-save-btn" type="button">▣ 이미지로 저장</button><div><p class="date-note" id="today-note"></p><span class="save-note">내 옷장에 자동 저장돼요</span></div></div></header>
    <div class="layout">
      <section class="panel" aria-labelledby="week-title"><div class="panel-heading"><div><p class="kicker">MY WEEK</p><h2 id="week-title">주간 코디</h2></div><span class="week-label" id="week-label"></span></div><div class="week-grid" id="week-grid"></div></section>
      <aside class="panel wardrobe" aria-labelledby="wardrobe-title"><div class="panel-heading"><div><p class="kicker">MY CLOSET</p><h2 id="wardrobe-title">기본 옷장</h2></div><span class="week-label" id="item-count"></span></div><form class="wardrobe-form" id="wardrobe-form"><input id="clothing-name" type="text" placeholder="옷 이름을 입력하세요" maxlength="40" autocomplete="off"><button class="add-btn" type="submit">+ 옷 추가</button></form><div class="clothes-list" id="clothes-list"></div></aside>
    </div>
  </main>
  <script>
    const storageKey = "wear-this-week-data";
    const dayNames = ["일", "월", "화", "수", "목", "금", "토"];
    const now = new Date();
    let saved = null;
    try { saved = JSON.parse(localStorage.getItem(storageKey) || "null"); } catch (error) { saved = null; }
    let clothes = Array.isArray(saved?.clothes) ? saved.clothes : [];
    let outfits = saved?.outfits && typeof saved.outfits === "object" ? saved.outfits : {};
    let notes = saved?.notes && typeof saved.notes === "object" ? saved.notes : {};
    const $ = (selector) => document.querySelector(selector);
    const save = () => localStorage.setItem(storageKey, JSON.stringify({ clothes, outfits, notes }));
    const dateKey = (date) => `${date.getFullYear()}-${date.getMonth() + 1}-${date.getDate()}`;
    const startDate = new Date(now.getFullYear(), 8, 10);
    const weekDates = Array.from({ length: 10 }, (_, index) => { const date = new Date(startDate); date.setDate(startDate.getDate() + index); return date; });
    function escapeHtml(text) { const div = document.createElement("div"); div.textContent = text; return div.innerHTML; }
    function renderWardrobe() { const list = $("#clothes-list"); $("#item-count").textContent = `${clothes.length}벌`; list.innerHTML = clothes.length ? clothes.map((item) => `<div class="clothing-item" draggable="true" data-clothing-id="${item.id}"><span class="clothing-icon">◌</span><div class="clothing-info"><div class="clothing-name">${escapeHtml(item.name)}</div></div><button class="delete-btn" type="button" data-delete="${item.id}" aria-label="${escapeHtml(item.name)} 삭제">×</button></div>`).join("") : `<div class="empty-wardrobe">아직 옷이 없어요.<br>자주 입는 기본 아이템부터 추가해 보세요.</div>`; list.querySelectorAll("[data-delete]").forEach((button) => button.addEventListener("click", () => { const id = Number(button.dataset.delete); clothes = clothes.filter((item) => item.id !== id); Object.keys(outfits).forEach((key) => { outfits[key] = (Array.isArray(outfits[key]) ? outfits[key] : []).filter((clothingId) => clothingId !== id); }); save(); renderAll(); })); list.querySelectorAll("[data-clothing-id]").forEach((item) => item.addEventListener("dragstart", (event) => { if (!event.dataTransfer) return; event.dataTransfer.setData("text/plain", item.dataset.clothingId); event.dataTransfer.effectAllowed = "copy"; })); }
    function addToDay(day, selectedId, newName) { let clothingId = selectedId; if (newName) { const existing = clothes.find((item) => item.name === newName); clothingId = existing?.id || Date.now(); if (!existing) clothes.push({ id: clothingId, name: newName }); } const dayItems = Array.isArray(outfits[day]) ? outfits[day] : []; if (!clothingId || dayItems.includes(clothingId)) return; outfits[day] = [...dayItems, clothingId]; save(); renderAll(); }
    function reorderOutfit(day, sourceIndex, targetIndex) { const dayItems = Array.isArray(outfits[day]) ? [...outfits[day]] : []; const [movedItem] = dayItems.splice(sourceIndex, 1); const insertIndex = sourceIndex < targetIndex ? targetIndex - 1 : targetIndex; dayItems.splice(insertIndex, 0, movedItem); outfits[day] = dayItems; save(); renderWeek(); }
    function renderWeek() { $("#week-grid").innerHTML = weekDates.map((date) => { const key = dateKey(date); const itemIds = Array.isArray(outfits[key]) ? outfits[key] : []; const items = itemIds.map((id) => clothes.find((item) => item.id === id)).filter(Boolean); return `<article class="day-card ${key === dateKey(now) ? "today" : ""}" data-day="${key}"><div class="day-top"><span class="day-name">${dayNames[date.getDay()]}요일</span><span class="day-number">${date.getMonth() + 1}.${date.getDate()}</span></div><textarea class="day-memo" data-note-day="${key}" placeholder="이 날의 메모" aria-label="${dayNames[date.getDay()]}요일 메모">${escapeHtml(notes[key] || "")}</textarea>${items.length ? items.map((item, itemIndex) => `<div class="outfit-slot filled" draggable="true" data-outfit-day="${key}" data-outfit-index="${itemIndex}"><span>${escapeHtml(item.name)}</span><button class="outfit-delete" type="button" data-remove-day="${key}" data-remove-clothing="${item.id}" aria-label="${escapeHtml(item.name)} 착장 삭제">×</button></div>`).join("") : `<div class="outfit-slot">이 날 입을 옷을 추가하세요</div>`}<form class="day-add-form" data-day-form="${key}"><input type="text" placeholder="새 옷 이름" maxlength="40" autocomplete="off"><button type="submit">+ 추가</button></form></article>`; }).join(""); $("#week-grid").querySelectorAll("[data-outfit-day]").forEach((item) => { item.addEventListener("dragstart", (event) => { if (!event.dataTransfer) return; event.stopPropagation(); event.dataTransfer.setData("application/x-outfit", JSON.stringify({ day: item.dataset.outfitDay, index: Number(item.dataset.outfitIndex) })); event.dataTransfer.effectAllowed = "move"; }); item.addEventListener("dragover", (event) => event.preventDefault()); item.addEventListener("drop", (event) => { event.preventDefault(); event.stopPropagation(); if (!event.dataTransfer) return; const source = JSON.parse(event.dataTransfer.getData("application/x-outfit") || "null"); if (source && source.day === item.dataset.outfitDay && source.index !== Number(item.dataset.outfitIndex)) reorderOutfit(source.day, source.index, Number(item.dataset.outfitIndex)); }); }); $("#week-grid").querySelectorAll("[data-day]").forEach((day) => { day.addEventListener("dragover", (event) => { event.preventDefault(); day.classList.add("drag-over"); }); day.addEventListener("dragleave", () => day.classList.remove("drag-over")); day.addEventListener("drop", (event) => { event.preventDefault(); if (!event.dataTransfer) return; const internal = event.dataTransfer.getData("application/x-outfit"); if (internal) return; const clothingId = Number(event.dataTransfer.getData("text/plain")); day.classList.remove("drag-over"); addToDay(day.dataset.day, clothingId, ""); }); }); $("#week-grid").querySelectorAll("[data-day-form]").forEach((form) => form.addEventListener("submit", (event) => { event.preventDefault(); addToDay(form.closest("[data-day]").dataset.day, 0, form.querySelector("input").value.trim()); })); $("#week-grid").querySelectorAll("[data-note-day]").forEach((memo) => memo.addEventListener("input", () => { notes[memo.dataset.noteDay] = memo.value; save(); })); $("#week-grid").querySelectorAll("[data-remove-day]").forEach((button) => button.addEventListener("click", () => { const dayItems = Array.isArray(outfits[button.dataset.removeDay]) ? outfits[button.dataset.removeDay] : []; outfits[button.dataset.removeDay] = dayItems.filter((id) => id !== Number(button.dataset.removeClothing)); save(); renderWeek(); })); }
    function renderAll() { renderWardrobe(); renderWeek(); }
    $("#today-note").textContent = `${now.getFullYear()}년 ${now.getMonth() + 1}월 ${now.getDate()}일 ${dayNames[now.getDay()]}요일`; $("#week-label").textContent = `${startDate.getMonth() + 1}.${startDate.getDate()} — ${weekDates[9].getMonth() + 1}.${weekDates[9].getDate()}`;
    $("#wardrobe-form").addEventListener("submit", (event) => { event.preventDefault(); const input = $("#clothing-name"); const name = input.value.trim(); if (!name) return; if (!clothes.some((item) => item.name === name)) clothes.push({ id: Date.now(), name }); input.value = ""; save(); renderAll(); input.focus(); });
    function roundedRect(context, x, y, width, height, radius, fill, stroke) { context.beginPath(); context.roundRect(x, y, width, height, radius); context.fillStyle = fill; context.fill(); if (stroke) { context.strokeStyle = stroke; context.stroke(); } }
    function exportPlanAsImage() { const canvas = document.createElement("canvas"); canvas.width = 1800; canvas.height = 1120; const context = canvas.getContext("2d"); context.fillStyle = "#fff4f6"; context.fillRect(0, 0, canvas.width, canvas.height); context.fillStyle = "#674b55"; context.font = "52px Jua, sans-serif"; context.fillText("여행지에서 뭐 입지?", 90, 105); context.fillStyle = "#a38e94"; context.font = "22px Jua, sans-serif"; context.fillText("9월 10일 - 9월 19일  ·  나의 코디 기록", 94, 148); const cardWidth = 310; const cardHeight = 420; const gap = 20; weekDates.forEach((date, index) => { const column = index % 5; const row = Math.floor(index / 5); const x = 90 + column * (cardWidth + gap); const y = 195 + row * (cardHeight + gap); const key = dateKey(date); const itemIds = Array.isArray(outfits[key]) ? outfits[key] : []; const names = itemIds.map((id) => clothes.find((item) => item.id === id)?.name).filter(Boolean); roundedRect(context, x, y, cardWidth, cardHeight, 22, "#fffdfd", "#f2dce2"); context.fillStyle = "#b86d87"; context.font = "26px Jua, sans-serif"; context.fillText(`${date.getMonth() + 1}.${date.getDate()} ${dayNames[date.getDay()]}요일`, x + 24, y + 48); const memo = String(notes[key] || "").trim(); if (memo) { context.setLineDash([7, 5]); context.strokeStyle = "#e4b7c4"; context.strokeRect(x + 20, y + 61, cardWidth - 40, 35); context.setLineDash([]); context.fillStyle = "#a38e94"; context.font = "18px Jua, sans-serif"; context.fillText(memo.slice(0, 23), x + 32, y + 85); } context.fillStyle = "#59484c"; context.font = "22px Jua, sans-serif"; names.forEach((name, itemIndex) => { roundedRect(context, x + 20, y + 108 + itemIndex * 47, cardWidth - 40, 36, 10, "#fbe3ea"); context.fillStyle = "#59484c"; context.fillText(name.slice(0, 18), x + 32, y + 134 + itemIndex * 47); }); }); const link = document.createElement("a"); link.download = "travel-outfit-plan.png"; link.href = canvas.toDataURL("image/png"); link.click(); }
    $("#image-save-btn").addEventListener("click", exportPlanAsImage);
    renderAll();
  </script>
</body>
