<!doctype html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>여행지에서 뭐 입지?</title>
<style>
@import url('https://fonts.googleapis.com/css2?family=Jua&display=swap');
:root{--ink:#59484c;--muted:#a38e94;--paper:#fff4f6;--panel:#fffdfd;--line:#f2dce2;--pink:#e993a8;--pink-dark:#b86d87;--soft:#fbe3ea;--shadow:0 16px 42px rgba(190,113,139,.13)}
*{box-sizing:border-box}body{margin:0;min-height:100vh;color:var(--ink);font-family:Jua,'Malgun Gothic',sans-serif;background:radial-gradient(circle at 8% 4%,#ffe2eb 0 9%,transparent 25%),radial-gradient(circle at 92% 30%,#fff0d9 0 7%,transparent 23%),var(--paper)}
button,input,textarea{font:inherit}button{border:0;cursor:pointer}.shell{width:min(1180px,calc(100% - 48px));margin:auto;padding:48px 0 70px}.topbar{display:flex;justify-content:space-between;align-items:end;gap:24px;margin-bottom:32px}.brand{display:inline-flex;align-items:center;gap:9px;color:var(--pink-dark);font-size:12px;letter-spacing:1.8px}.brand:before{content:'';width:10px;height:10px;border-radius:50%;background:var(--pink);box-shadow:5px -4px #f8d99a}h1,h2,p{margin-top:0}h1{margin:14px 0 0;color:#674b55;font-size:clamp(42px,6vw,72px);font-weight:400;line-height:.98}h2{margin:0;font-size:28px;font-weight:400}.top-tools{display:grid;justify-items:end;gap:12px}.date-note{margin:0 0 5px;color:var(--muted);font-size:13px}.save-note{color:var(--muted);font-size:12px}.save-note:before{content:'●';margin-right:7px;color:var(--pink)}
.layout{display:grid;gap:26px}.panel{padding:28px;background:rgba(255,253,253,.94);border:1px solid var(--line);border-radius:18px;box-shadow:var(--shadow)}.panel-heading{display:flex;justify-content:space-between;gap:15px;margin-bottom:22px}.kicker{margin:0 0 7px;color:var(--pink);font-size:11px;letter-spacing:1.4px}.range{color:var(--muted);font-size:12px}.image-save-btn,.add-btn,.day-add-form button{color:#fff;background:var(--pink);border-radius:10px}.image-save-btn{padding:10px 15px;font-size:12px;box-shadow:0 6px 14px rgba(190,113,139,.18)}.image-save-btn:hover,.add-btn:hover,.day-add-form button:hover{background:var(--pink-dark)}
.wardrobe{order:-1}.wardrobe-form{display:grid;grid-template-columns:1fr auto;gap:9px;margin-bottom:18px}.wardrobe-form input,.day-add-form input{width:100%;min-width:0;padding:11px 12px;color:var(--ink);background:#fffafa;border:1px solid var(--line);border-radius:9px;outline:0}.add-btn{padding:0 16px}.clothes-list{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:6px;max-height:190px;overflow:auto}.clothing-item{display:flex;align-items:center;gap:6px;min-width:0;padding:7px;background:#fffafb;border:1px solid var(--line);border-radius:10px;cursor:grab;touch-action:none}.clothing-item:active,.touch-dragging{cursor:grabbing;opacity:.65}.clothing-icon{display:grid;place-items:center;width:24px;height:24px;flex:0 0 24px;border-radius:50%;color:var(--pink-dark);background:var(--soft)}.clothing-info{min-width:0;flex:1}.clothing-name{overflow:hidden;text-overflow:ellipsis;white-space:nowrap;font-size:11px}.delete-btn,.outfit-delete{padding:2px;color:#d0aab7;background:transparent;font-size:14px}.delete-btn:hover,.outfit-delete:hover{color:var(--pink-dark)}.empty{grid-column:1/-1;padding:18px 4px;color:var(--muted);font-size:12px;text-align:center}
.week-grid{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:8px}.day-card{min-width:0;min-height:235px;padding:13px 10px;background:#fffafb;border:1px solid var(--line);border-radius:14px}.day-card.today{border:2px solid var(--pink);background:#fff0f4}.day-card.drag-over{border-color:var(--pink-dark);background:#fff0f2}.day-top{display:flex;justify-content:flex-start;align-items:baseline;gap:6px;margin-bottom:0}.day-name{font-size:13px}.day-number{color:var(--muted);font-size:11px}.day-memo{width:100%;min-height:42px;margin:8px 0 10px;padding:7px;resize:vertical;color:var(--ink);background:#fffdf8;border:1px solid var(--line);border-radius:8px;outline:0;font-size:10px}.day-memo:focus{border-color:var(--pink);box-shadow:0 0 0 2px var(--soft)}.outfit-slot{display:flex;justify-content:space-between;align-items:center;gap:5px;min-height:38px;margin-top:7px;padding:6px;color:var(--muted);background:#fff;border:1px dashed #ead7dd;border-radius:9px;font-size:11px;text-align:center}.outfit-slot.filled{color:var(--ink);background:var(--soft);border-color:transparent;font-weight:700;cursor:grab;touch-action:none}.day-add-form{display:grid;gap:5px;margin-top:10px}.day-add-form input{padding:7px 6px;font-size:10px}.day-add-form button{padding:7px 5px;font-size:10px}.outfit-delete{flex:0 0 auto}
 .selection-status{display:none;color:var(--pink-dark);font-size:11px}.day-add-form{display:none!important}.clothing-item.selected{border:2px solid var(--pink);background:var(--soft);box-shadow:0 5px 12px rgba(190,113,139,.16)}.date-tabs{display:flex;gap:6px;margin-top:18px;padding:10px 2px 4px;overflow-x:auto;border-top:1px solid var(--line)}.date-tab{flex:0 0 auto;padding:8px 12px;color:var(--muted);background:#fffafb;border:1px solid var(--line);border-radius:9px;font-size:11px;white-space:nowrap}.date-tab.active{color:#fff;background:var(--pink);border-color:var(--pink)}.date-tab.drag-over{color:var(--pink-dark);background:var(--soft);border-color:var(--pink-dark)}.day-card[hidden]{display:none!important}@media(max-width:900px){.week-grid{grid-template-columns:repeat(2,minmax(0,1fr))}.selection-status{display:block}}@media(max-width:560px){.shell{width:calc(100% - 28px);padding-top:30px}.topbar{display:block}.top-tools{justify-items:start;margin-top:22px}.panel{padding:18px}.week-grid{gap:6px}.day-card{padding:10px 7px}.day-name{font-size:12px}}
</style>
</head>
<body>
<main class="shell">
<header class="topbar"><div><span class="brand">WEAR THIS WEEK</span><h1>여행지에서<br>뭐 입지?</h1></div><div class="top-tools"><button class="image-save-btn" id="image-save-btn" type="button">▣ 이미지로 저장</button><div><p class="date-note" id="today-note"></p><span class="save-note">내 옷장에 자동 저장돼요</span></div></div></header>
<div class="layout">
<section class="panel" aria-labelledby="week-title"><div class="panel-heading"><div><p class="kicker">MY WEEK</p><h2 id="week-title">주간 코디</h2></div><span class="range" id="week-label"></span></div><div class="week-grid" id="week-grid"></div></section>
<aside class="panel wardrobe" aria-labelledby="wardrobe-title"><div class="panel-heading"><div><p class="kicker">MY CLOSET</p><h2 id="wardrobe-title">기본 옷장</h2></div><div><span class="range" id="item-count"></span><span class="selection-status" id="selection-status">옷을 선택하세요</span></div></div><form class="wardrobe-form" id="wardrobe-form"><input id="clothing-name" type="text" placeholder="옷 이름을 입력하세요" maxlength="40" autocomplete="off"><button class="add-btn" type="submit">+ 옷 추가</button></form><div class="clothes-list" id="clothes-list"></div><div class="date-tabs" id="date-tabs" aria-label="날짜 선택"></div></aside>
</div>
</main>
<script>
const key='wear-this-week-data',days=['일','월','화','수','목','금','토'],now=new Date();let data={};try{data=JSON.parse(localStorage.getItem(key)||'{}')}catch(e){}let clothes=Array.isArray(data.clothes)?data.clothes:[],outfits=data.outfits&&typeof data.outfits==='object'?data.outfits:{},notes=data.notes&&typeof data.notes==='object'?data.notes:{};const $=s=>document.querySelector(s),save=()=>localStorage.setItem(key,JSON.stringify({clothes,outfits,notes})),dateKey=d=>`${d.getFullYear()}-${d.getMonth()+1}-${d.getDate()}`,start=new Date(now.getFullYear(),8,10),dates=Array.from({length:10},(_,i)=>{const d=new Date(start);d.setDate(start.getDate()+i);return d});
function esc(value){const el=document.createElement('span');el.textContent=value;return el.innerHTML}function addToDay(day,id,name){let itemId=id;if(name){const existing=clothes.find(item=>item.name===name);itemId=existing?.id||Date.now();if(!existing)clothes.push({id:itemId,name})}const list=Array.isArray(outfits[day])?outfits[day].map(Number):[];if(!itemId||list.some(existingId=>existingId===Number(itemId)))return;outfits[day]=[...list,Number(itemId)];save();render()}
function renderWardrobe(){const list=$('#clothes-list');$('#item-count').textContent=`${clothes.length}벌`;list.innerHTML=clothes.length?clothes.map(item=>`<div class="clothing-item" draggable="true" data-clothing-id="${item.id}"><span class="clothing-icon">◌</span><div class="clothing-info"><div class="clothing-name">${esc(item.name)}</div></div><button class="delete-btn" type="button" data-delete="${item.id}" aria-label="${esc(item.name)} 삭제">×</button></div>`).join(''):'<div class="empty">아직 옷이 없어요.<br>기본 아이템부터 추가해 보세요.</div>';list.querySelectorAll('[data-delete]').forEach(btn=>btn.onclick=()=>{const id=Number(btn.dataset.delete);clothes=clothes.filter(item=>item.id!==id);Object.keys(outfits).forEach(day=>{if(Array.isArray(outfits[day]))outfits[day]=outfits[day].filter(itemId=>itemId!==id)});save();render()});list.querySelectorAll('[data-clothing-id]').forEach(item=>item.ondragstart=e=>{e.dataTransfer.setData('text/plain',item.dataset.clothingId);e.dataTransfer.effectAllowed='copy'})}
function reorder(day,from,to){const list=[...outfits[day]];const[moved]=list.splice(from,1);list.splice(from<to?to-1:to,0,moved);outfits[day]=list;save();renderWeek()}
function renderWeek(){const grid=$('#week-grid');grid.innerHTML=dates.map(d=>{const day=dateKey(d),ids=Array.isArray(outfits[day])?outfits[day]:[],items=ids.map(id=>clothes.find(item=>item.id===id)).filter(Boolean);return `<article class="day-card ${day===dateKey(now)?'today':''}" data-day="${day}"><div class="day-top"><span class="day-name">${days[d.getDay()]}요일</span><span class="day-number">${d.getMonth()+1}.${d.getDate()}</span></div><textarea class="day-memo" data-note="${day}" placeholder="이 날의 메모" aria-label="${days[d.getDay()]}요일 메모">${esc(notes[day]||'')}</textarea>${items.length?items.map((item,i)=>`<div class="outfit-slot filled" draggable="true" data-outfit-day="${day}" data-outfit-index="${i}"><span>${esc(item.name)}</span><button class="outfit-delete" type="button" data-remove-day="${day}" data-remove-id="${item.id}" aria-label="${esc(item.name)} 착장 삭제">×</button></div>`).join(''):'<div class="outfit-slot">이 날 입을 옷을 추가하세요</div>'}<form class="day-add-form" data-form-day="${day}"><input type="text" placeholder="새 옷 이름" maxlength="40" autocomplete="off"><button type="submit">+ 추가</button></form></article>`}).join('');grid.querySelectorAll('[data-form-day]').forEach(form=>form.onsubmit=e=>{e.preventDefault();addToDay(form.dataset.formDay,0,form.querySelector('input').value.trim())});grid.querySelectorAll('[data-note]').forEach(area=>area.oninput=()=>{notes[area.dataset.note]=area.value;save()});grid.querySelectorAll('[data-remove-day]').forEach(btn=>btn.onclick=()=>{outfits[btn.dataset.removeDay]=(outfits[btn.dataset.removeDay]||[]).filter(id=>id!==Number(btn.dataset.removeId));save();renderWeek()});grid.querySelectorAll('[data-outfit-day]').forEach(item=>{item.ondragstart=e=>{if(!e.dataTransfer)return;e.stopPropagation();e.dataTransfer.setData('application/x-outfit',JSON.stringify({day:item.dataset.outfitDay,index:Number(item.dataset.outfitIndex)}))};item.ondragover=e=>e.preventDefault();item.ondrop=e=>{e.preventDefault();e.stopPropagation();if(!e.dataTransfer)return;const source=JSON.parse(e.dataTransfer.getData('application/x-outfit')||'null');if(source&&source.day===item.dataset.outfitDay&&source.index!==Number(item.dataset.outfitIndex))reorder(source.day,source.index,Number(item.dataset.outfitIndex))}});grid.querySelectorAll('[data-day]').forEach(day=>{day.ondragover=e=>{e.preventDefault();day.classList.add('drag-over')};day.ondragleave=()=>day.classList.remove('drag-over');day.ondrop=e=>{e.preventDefault();const internal=e.dataTransfer?.getData('application/x-outfit');day.classList.remove('drag-over');if(!internal)addToDay(day.dataset.day,Number(e.dataTransfer?.getData('text/plain')), '')}})}
let selectedClothingId=null;document.addEventListener('click',e=>{const clothing=e.target.closest('[data-clothing-id]');if(clothing&&!e.target.closest('button')){selectedClothingId=Number(clothing.dataset.clothingId);document.querySelectorAll('[data-clothing-id]').forEach(item=>item.classList.toggle('selected',item===clothing));$('#selection-status').textContent='선택됨 · 날짜를 눌러 추가';return}const day=e.target.closest('[data-day]');if(day&&selectedClothingId&&!e.target.closest('textarea,form,button,[data-outfit-day]')){addToDay(day.dataset.day,selectedClothingId,'')}});function render(){renderWardrobe();renderWeek()}$('#today-note').textContent=`${now.getFullYear()}년 ${now.getMonth()+1}월 ${now.getDate()}일 ${days[now.getDay()]}요일`;$('#week-label').textContent='9.10 — 9.19';$('#wardrobe-form').onsubmit=e=>{e.preventDefault();const input=$('#clothing-name'),name=input.value.trim();if(name&&!clothes.some(item=>item.name===name))clothes.push({id:Date.now(),name});input.value='';save();render()};
let touch=null;function touchDay(point){return document.elementFromPoint(point.clientX,point.clientY)?.closest('[data-day]')}document.addEventListener('touchstart',e=>{const source=e.target.closest('[data-clothing-id],[data-outfit-day]');if(!source||e.target.closest('button'))return;const point=e.touches[0];touch=source.dataset.clothingId?{type:'wardrobe',id:Number(source.dataset.clothingId),source}:{type:'outfit',day:source.dataset.outfitDay,index:Number(source.dataset.outfitIndex),source};source.classList.add('touch-dragging');touch.x=point.clientX;touch.y=point.clientY},{passive:true});document.addEventListener('touchmove',e=>{if(!touch)return;e.preventDefault();document.querySelectorAll('.drag-over').forEach(el=>el.classList.remove('drag-over'));const day=touchDay(e.touches[0]);if(day)day.classList.add('drag-over')},{passive:false});document.addEventListener('touchend',e=>{if(!touch)return;const drag=touch,point=e.changedTouches[0],day=touchDay(point),target=document.elementFromPoint(point.clientX,point.clientY)?.closest('[data-outfit-day]');if(day&&drag.type==='wardrobe')addToDay(day.dataset.day,drag.id,'');else if(target&&drag.type==='outfit'&&target.dataset.outfitDay===drag.day&&drag.index!==Number(target.dataset.outfitIndex))reorder(drag.day,drag.index,Number(target.dataset.outfitIndex));document.querySelectorAll('.touch-dragging,.drag-over').forEach(el=>el.classList.remove('touch-dragging','drag-over'));touch=null},{passive:true});
function rounded(ctx,x,y,w,h,r,fill,stroke){ctx.beginPath();ctx.roundRect(x,y,w,h,r);ctx.fillStyle=fill;ctx.fill();if(stroke){ctx.strokeStyle=stroke;ctx.stroke()}}function exportImage(){const canvas=document.createElement('canvas');canvas.width=1800;canvas.height=1120;const ctx=canvas.getContext('2d');ctx.fillStyle='#fff4f6';ctx.fillRect(0,0,1800,1120);ctx.fillStyle='#674b55';ctx.font='52px Jua,sans-serif';ctx.fillText('여행지에서 뭐 입지?',90,105);ctx.font='22px Jua,sans-serif';ctx.fillStyle='#a38e94';ctx.fillText('9월 10일 - 9월 19일 · 나의 코디 기록',94,148);dates.forEach((d,i)=>{const x=90+i%5*330,y=195+Math.floor(i/5)*440,day=dateKey(d),items=(outfits[day]||[]).map(id=>clothes.find(item=>item.id===id)?.name).filter(Boolean);rounded(ctx,x,y,310,420,22,'#fffdfd','#f2dce2');ctx.fillStyle='#b86d87';ctx.font='26px Jua,sans-serif';ctx.fillText(`${d.getMonth()+1}.${d.getDate()} ${days[d.getDay()]}요일`,x+24,y+48);const memo=String(notes[day]||'').trim();if(memo){ctx.setLineDash([7,5]);ctx.strokeStyle='#e4b7c4';ctx.strokeRect(x+20,y+61,270,35);ctx.setLineDash([]);ctx.fillStyle='#a38e94';ctx.font='18px Jua,sans-serif';ctx.fillText(memo.slice(0,23),x+32,y+85)}items.forEach((name,j)=>{rounded(ctx,x+20,y+108+j*47,270,36,10,'#fbe3ea');ctx.fillStyle='#59484c';ctx.font='22px Jua,sans-serif';ctx.fillText(name.slice(0,18),x+32,y+134+j*47)})});const link=document.createElement('a');link.download='travel-outfit-plan.png';link.href=canvas.toDataURL('image/png');link.click()}$('#image-save-btn').onclick=exportImage;render();
</script>
<script>
let activeDay='all';
function updateDateView(){document.querySelectorAll('[data-day]').forEach(card=>{card.hidden=activeDay!=='all'&&card.dataset.day!==activeDay});document.querySelectorAll('[data-date-tab]').forEach(tab=>tab.classList.toggle('active',tab.dataset.dateTab===activeDay))}
function renderDateTabs(){const tabs=$('#date-tabs');if(!tabs)return;tabs.innerHTML=`<button class="date-tab active" type="button" data-date-tab="all">전체보기</button>`+dates.map(date=>{const day=dateKey(date);return `<button class="date-tab" type="button" data-date-tab="${day}">${date.getMonth()+1}.${date.getDate()} ${days[date.getDay()]}요일</button>`}).join('');tabs.querySelectorAll('[data-date-tab]').forEach(tab=>{tab.onclick=()=>{if(tab.dataset.dateTab!=='all'&&selectedClothingId){addToDay(tab.dataset.dateTab,selectedClothingId,'')}activeDay=tab.dataset.dateTab;updateDateView()};tab.ondragover=e=>{e.preventDefault();tab.classList.add('drag-over')};tab.ondragleave=()=>tab.classList.remove('drag-over');tab.ondrop=e=>{e.preventDefault();tab.classList.remove('drag-over');const id=Number(e.dataTransfer?.getData('text/plain'));if(id)addToDay(tab.dataset.dateTab,id,'')}});updateDateView()}
document.addEventListener('dragstart',e=>{const source=e.target.closest('[data-clothing-id]');if(source&&e.dataTransfer){e.dataTransfer.setData('text/plain',source.dataset.clothingId);e.dataTransfer.effectAllowed='copy'}});renderDateTabs();new MutationObserver(updateDateView).observe($('#week-grid'),{childList:true});
</script>
</body>
</html>
